apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $.Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |- 
{{- $kv := .Values.keyVault }}
{{- range $key, $val := $kv }}
{{- if and (kindIs "map" $val) (hasKey $val "jmesPath") }}
        - objectName: {{ $key }}
          objectType: {{ default "secretsmanager" $val.objectType }}
          jmesPath:
{{- range $i, $item := $val.jmesPath }}
            - path: "\"{{ $item.path }}\""
              objectAlias: {{ $item.path }}
{{- end }}
{{- end }}
{{- end }}
  secretObjects:
    - secretName: {{ .Values.kubeSecretReferenceName }}
      type: Opaque
      data:
{{- /* collect all jmesPath.path values across keyVault entries */}}
{{- $kv := .Values.keyVault }}
{{- range $key, $val := $kv }}
{{- if and (kindIs "map" $val) (hasKey $val "jmesPath") }}
{{- range $i, $item := $val.jmesPath }}
        - objectName: {{ $item.path }}
          key: {{ $item.path }}
{{- end }}
{{- end }}
{{- end }}
