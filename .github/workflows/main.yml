# .github/workflows/main.yml
# GitHub Actions equivalent of the provided GitLab CI pipeline
# Platform-specific notes and limitations are included as comments.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.git.epam.com
  # GitHub does not provide a direct equivalent for CI_PROJECT_PATH; using github.repository instead
  DOCKER_IMAGE_NAME: registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests
  # GitHub does not provide CI_COMMIT_SHORT_SHA, but github.sha is available (full SHA)
  DOCKER_TAG: ${{ github.sha }}
  # DOCKER_HOST: tcp://docker:2375
  # DOCKER_DRIVER: overlay2

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} .
          docker save ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} -o image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  push_latest:
    name: Push Docker Image as 'latest' (main branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Tag and push as latest
        run: |
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
    # NOTE: You must set CI_REGISTRY_USER and CI_REGISTRY_PASSWORD as repository secrets.

  push_branch_sha:
    name: Push Docker Image as '{sha}' (non-main branches)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Push Docker image with SHA tag
        run: |
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
    # NOTE: You must set CI_REGISTRY_USER and CI_REGISTRY_PASSWORD as repository secrets.

# Platform-specific notes:
# - GitHub Actions does not support true "manual" jobs except via workflow_dispatch or environment approvals.
# - Some GitLab variables (e.g., CI_PROJECT_PATH, CI_COMMIT_SHORT_SHA) are mapped to GitHub equivalents or approximated.
# - All required secrets (Docker registry) must be set in the repository's Secrets settings.
# - Docker-in-Docker is not natively supported in GitHub Actions, but Buildx and standard Docker commands work for most use cases.
# - Artifacts are passed between jobs using upload/download-artifact actions.
