# .github/workflows/main.yml
# GitHub Actions equivalent of the provided GitLab CI pipeline
# Platform-specific notes and limitations are included as comments

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests
  DOCKER_TAG: ${{ github.sha }}
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  HELM_RELEASE: api-tests-${{ github.sha }}
  K8S_NAMESPACE: default
  HELM_CHART_PATH: .kube/pet-store

jobs:

  branch_name_check:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Check branch name
        run: |
          echo "Validating branch name '${{github.head_ref}}'..."
          if [[ "${{github.head_ref}}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name: ${{github.head_ref}}. Must match regex: ^[A-Za-z0-9_-]+$"
            exit 1
          fi

  gradle_compile:
    name: Gradle Compile
    runs-on: ubuntu-latest
    needs: branch_name_check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/wrapper
            .gradle/caches
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Gradle version
        run: gradle --version
      - name: Compile with Gradle
        run: |
          echo "Compiling project with Gradle..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD=./gradlew
          else
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD --no-daemon clean build -x check

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: gradle_compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
      - name: Save Docker image as artifact
        run: |
          docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG > image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  helm_e2e_run:
    name: Helm E2E Run (manual)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    # GitHub Actions does not support true "manual" jobs (like GitLab's 'when: manual').
    # To run this job manually, use workflow_dispatch or separate workflow.
    # See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Install kubectl, helm, jq, curl, tar
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar jq
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
          kubectl config current-context
          kubectl get ns || true
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Helm upgrade/install
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}"
          helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_PATH}" --namespace "${K8S_NAMESPACE}"
      - name: Verify rollout
        run: |
          TIMEOUT="${HELM_WAIT_TIMEOUT:-300s}"
          kubectl rollout status job/"${HELM_RELEASE}" -n "${K8S_NAMESPACE}" --timeout="${TIMEOUT}" || true
        env:
          HELM_WAIT_TIMEOUT: ${{ secrets.HELM_WAIT_TIMEOUT }}

  push_latest:
    name: Push Docker image as 'latest' (main branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load < image.tar
      - name: Tag and push as latest
        run: |
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

  push_branch_sha:
    name: Push Docker image as '{sha}' (non-main branches)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load < image.tar
      - name: Push image with sha tag
        run: docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG

# -------------------------
# Platform-specific notes:
# - GitHub Actions does not support true "manual" jobs in the same way as GitLab's 'when: manual'.
#   For manual execution, use workflow_dispatch or separate workflow.
# - All secrets (CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, AWS_ACCESS_KEY_ID, etc.) must be set in GitHub repository secrets.
# - Docker-in-Docker is not natively supported; this workflow uses Buildx and standard Docker commands.
# - Artifacts are passed between jobs using actions/upload-artifact and actions/download-artifact.
# - Job dependencies are mapped using 'needs'.
# - Branch name and commit SHA are accessed via GitHub context variables.
# - Some shell logic (e.g., variable expansion) is adapted for bash on Ubuntu runners.
# - If you need to run helm_e2e_run manually, consider splitting it into a separate workflow with 'workflow_dispatch'.
