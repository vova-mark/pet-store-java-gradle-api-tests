# .github/workflows/ci.yml
# GitHub Actions equivalent of the provided GitLab CI pipeline
# Platform-specific notes and limitations are included as comments.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
  DOCKER_TAG: ${{ github.sha }}
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  HELM_RELEASE: api-tests-${{ github.sha }}
  K8S_NAMESPACE: default
  HELM_CHART_PATH: .kube/pet-store

jobs:

  branch_name_check:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "Validating branch name '${BRANCH_NAME}'..."
          if echo "${BRANCH_NAME}" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name: ${BRANCH_NAME}. Must match regex: ^[A-Za-z0-9_-]+$"
            exit 1
          fi

  gradle_compile:
    name: Compile with Gradle
    runs-on: ubuntu-latest
    needs: branch_name_check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/wrapper
            .gradle/caches
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Gradle version
        run: gradle --version
      - name: Compile project
        run: |
          echo "Compiling project with Gradle..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD=./gradlew
          else
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD --no-daemon clean build -x check

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: gradle_compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
      - name: Save Docker image as artifact
        run: |
          docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  helm_e2e_run:
    name: Cloud test with Helm on EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: cloud-test
    # Manual trigger is not natively supported for a job in a push workflow.
    # To run this job manually, use workflow_dispatch or separate workflow.
    # See: https://github.com/orgs/community/discussions/26671
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Check required variables
        run: |
          REQUIRED_VARS="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION EKS_CLUSTER_NAME HELM_RELEASE HELM_CHART_PATH"
          MISSING=false
          for v in $REQUIRED_VARS; do
            if [ -z "${{ secrets[$v] || env[$v] }}" ]; then
              echo "Missing required variable: $v"
              MISSING=true
            fi
          done
          if [ "$MISSING" = "true" ]; then
            echo "One or more required variables are missing. Exiting."
            exit 1
          fi
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_DEFAULT_REGION }}"
          kubectl config current-context
          kubectl get ns || true
      - name: Helm upgrade/install
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART_PATH }}" --namespace "${{ env.K8S_NAMESPACE }}"
      - name: Verify rollout
        run: |
          TIMEOUT="${{ env.HELM_WAIT_TIMEOUT || '300s' }}"
          kubectl rollout status job/"${{ env.HELM_RELEASE }}" -n "${{ env.K8S_NAMESPACE }}" --timeout="${TIMEOUT}" || true

  push_latest:
    name: Push Docker image as 'latest' (main branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load < image.tar
      - name: Tag and push as latest
        run: |
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

  push_branch_sha:
    name: Push Docker image as '{sha}' (non-main branches)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load < image.tar
      - name: Push Docker image with SHA tag
        run: docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG

# --- Platform-specific notes ---
# - GitHub Actions does not support job-level manual triggers in push workflows.
#   For manual cloud-test, use workflow_dispatch or a separate workflow.
# - All required secrets (CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, AWS_*, EKS_CLUSTER_NAME, etc.)
#   must be set in GitHub repository secrets.
# - Docker-in-Docker is handled natively on GitHub-hosted runners.
# - Artifacts are used to pass the Docker image between jobs.
# - Some GitLab CI variables (e.g., CI_PROJECT_PATH, CI_COMMIT_SHORT_SHA) are mapped to GitHub equivalents.
# - If you need to run helm_e2e_run manually, consider splitting it into a separate workflow with on: workflow_dispatch.
