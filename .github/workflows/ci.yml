# .github/workflows/ci.yml
# GitHub Actions equivalent of your GitLab CI pipeline
# NOTE: See comments for platform-specific adaptations and limitations.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
  CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
  HELM_RELEASE: ${{ secrets.HELM_RELEASE }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  HELM_CHART_PATH: ${{ secrets.HELM_CHART_PATH }}
  HELM_WAIT_TIMEOUT: ${{ secrets.HELM_WAIT_TIMEOUT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  branch_name_check:
    name: Branch Name Check
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ ! "$BRANCH_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Branch name does not match required pattern."
            exit 1
          fi

  gradle_compile:
    name: Gradle Compile
    runs-on: ubuntu-latest
    needs: branch_name_check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Gradle Build
        run: ./gradlew build

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: gradle_compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${GITHUB_SHA} .
          docker save $DOCKER_IMAGE_NAME:${GITHUB_SHA} -o image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  helm_e2e_run:
    name: Helm E2E Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' # Manual trigger not natively supported; see comments below
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: image-tar
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Install AWS CLI, kubectl, helm
        run: |
          pip install awscli
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: AWS EKS Auth
        run: |
          aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME
      - name: Helm Upgrade & Rollout
        run: |
          helm upgrade --install $HELM_RELEASE $HELM_CHART_PATH \
            --namespace $K8S_NAMESPACE \
            --set image.repository=$DOCKER_IMAGE_NAME,image.tag=${GITHUB_SHA}
          kubectl rollout status deployment/$HELM_RELEASE -n $K8S_NAMESPACE --timeout=${HELM_WAIT_TIMEOUT:-300s}

  push_latest:
    name: Push Latest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: image-tar
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Tag and Push :latest
        run: |
          docker tag $DOCKER_IMAGE_NAME:${GITHUB_SHA} $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

  push_branch_sha:
    name: Push Branch SHA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: image-tar
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Tag and Push by SHA
        run: |
          docker tag $DOCKER_IMAGE_NAME:${GITHUB_SHA} $DOCKER_IMAGE_NAME:${GITHUB_SHA}
          docker push $DOCKER_IMAGE_NAME:${GITHUB_SHA}

# Platform-specific notes:
# - GitHub Actions does not support "manual" jobs natively. Use workflow_dispatch for manual triggers.
# - Docker-in-Docker is not recommended in GitHub Actions; jobs run in VMs with Docker pre-installed.
# - All secrets must be configured in GitHub repository settings.
# - Artifacts are used to transfer image.tar between jobs (similar to GitLab's artifacts).
# - Helm/kubectl/AWS CLI installation is done in steps; consider using pre-built actions for production.
# - Branch name check uses GITHUB_REF parsing; adjust if your branch naming differs.
# - If you need matrix builds or more advanced triggers, further adaptation may be required.
