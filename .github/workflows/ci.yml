# .github/workflows/ci.yml
# GitHub Actions equivalent of the provided GitLab CI pipeline
# Platform-specific notes and limitations are included as comments.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests
  DOCKER_TAG: ${{ github.sha }}
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  HELM_RELEASE: api-tests-${{ github.sha }}
  K8S_NAMESPACE: default
  HELM_CHART_PATH: .kube/pet-store

jobs:

  branch_name_check:
    name: Branch Name Check
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Validate branch name
        run: |
          echo "Validating branch name '${GITHUB_REF##*/}'..."
          if echo "${GITHUB_REF##*/}" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name: ${GITHUB_REF##*/}. Must match regex: ^[A-Za-z0-9_-]+$"
            exit 1
          fi

  gradle_compile:
    name: Gradle Compile
    runs-on: ubuntu-latest
    needs: branch_name_check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle/wrapper
            .gradle/caches
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Gradle Version
        run: ./gradlew --version || gradle --version
      - name: Compile with Gradle
        run: |
          echo "Compiling project with Gradle..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD=./gradlew
          else
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD --no-daemon clean build -x check

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: gradle_compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
          docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  helm_e2e_run:
    name: Helm E2E Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    # NOTE: GitHub Actions does not support "manual" jobs on push pipelines.
    # To run this job manually, use workflow_dispatch or a separate workflow.
    # The job will run automatically on push events.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      HELM_RELEASE: ${{ HELM_RELEASE }}
      HELM_CHART_PATH: ${{ HELM_CHART_PATH }}
      K8S_NAMESPACE: ${{ K8S_NAMESPACE }}
      HELM_WAIT_TIMEOUT: ${{ secrets.HELM_WAIT_TIMEOUT }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar jq
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
          kubectl config current-context
          kubectl get ns || true
      - name: Helm upgrade/install
        run: |
          echo "Running Helm upgrade --install for release '${HELM_RELEASE}' in namespace '${K8S_NAMESPACE}' using chart '${HELM_CHART_PATH}'..."
          helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_PATH}" --namespace "${K8S_NAMESPACE}"
      - name: Verify rollout
        run: |
          TIMEOUT="${HELM_WAIT_TIMEOUT:-300s}"
          kubectl rollout status job/"${HELM_RELEASE}" -n "${K8S_NAMESPACE}" --timeout="${TIMEOUT}" || true

  push_latest:
    name: Push Docker Image as 'latest'
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    env:
      DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Load and tag Docker image
        run: |
          docker load < image.tar
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
      - name: Push Docker image as latest
        run: docker push $DOCKER_IMAGE_NAME:latest

  push_branch_sha:
    name: Push Docker Image as SHA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name != 'main'
    env:
      DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
      CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
      CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: docker load < image.tar
      - name: Push Docker image as SHA
        run: docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG
