# .github/workflows/ci.yml
# GitHub Actions equivalent of the provided .gitlab-ci.yml
# Platform-specific adaptations and limitations are commented throughout.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:

env:
  DOCKER_REGISTRY: registry.git.epam.com
  # GITHUB_REPOSITORY is equivalent to CI_PROJECT_PATH
  DOCKER_IMAGE_NAME: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
  # GITHUB_SHA is the full commit SHA; we use the first 8 chars for short SHA
  DOCKER_TAG: ${{ github.sha }}
  DOCKER_DRIVER: overlay2

jobs:

  branch_name_check:
    name: Branch Name Check
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Check branch name against regex
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "Checking branch name '$BRANCH_NAME' against regex..."
          if [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "quality_gates" ]; then
            echo "Branch exempted from regex check: $BRANCH_NAME"
            exit 0
          fi
          if echo "$BRANCH_NAME" | grep -Eq '^(feature|bug|improvement)/[0-9A-Za-z-_]+$'; then
            echo "Branch name OK: $BRANCH_NAME"
          else
            echo "Branch name violates policy: $BRANCH_NAME"
            exit 1
          fi

  compile:
    name: Gradle Compile (no tests)
    runs-on: ubuntu-latest
    needs: [branch_name_check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Gradle assemble (no tests)
        run: ./gradlew clean assemble --no-daemon

  build_main:
    name: Build Docker Image (main)
    runs-on: ubuntu-latest
    needs: [compile]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"
          docker build -t "$IMAGE" .
          docker save "$IMAGE" > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-main
          path: image.tar

  build_non_main:
    name: Build Docker Image (non-main)
    runs-on: ubuntu-latest
    needs: [compile, branch_name_check]
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"
          docker build -t "$IMAGE" .
          docker save "$IMAGE" > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-non-main
          path: image.tar

  push_latest:
    name: Push Docker Image as 'latest' (main)
    runs-on: ubuntu-latest
    needs: [build_main]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load and tag Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"
          docker load < image.tar
          docker tag "$IMAGE" "${{ env.DOCKER_IMAGE_NAME }}:latest"
      - name: Push Docker image as 'latest'
        run: docker push "${{ env.DOCKER_IMAGE_NAME }}:latest"

  push_branch_sha:
    name: Push Docker Image as '{sha}' (non-main)
    runs-on: ubuntu-latest
    needs: [build_non_main]
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-non-main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"
          docker load < image.tar
      - name: Push Docker image as '{sha}'
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          docker push "${{ env.DOCKER_IMAGE_NAME }}:$SHORT_SHA"

  test_cloud:
    name: Cloud Test (Helm on EKS)
    runs-on: ubuntu-latest
    needs: [push_latest, push_branch_sha]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-north-1
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.3'
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name set-ai --region eu-north-1
      - name: Deploy test job via Helm
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          HELM_RELEASE="set-ai-tests-3-$SHORT_SHA"
          helm upgrade --install "$HELM_RELEASE" .kube/pet-store-tests -n default \
            --set image.repository="registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests" \
            --set image.tag="latest" \
            --set image.imagePullSecret="regcred" \
            --set namespace="default" \
            --set serviceAccountName="default" \
            --set keyVault.enabled=true \
            --set kubeSecretReferenceName="set-ai-secret" \
            --set keyVault.api-secrets.objectType="secretsmanager" \
            --set-string keyVault.api-secrets.jmesPath[0].path="bff-api-key" \
            --set-string env.ARGS="-Denv=dev"
      - name: Wait for job completion and dump logs
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          HELM_RELEASE="set-ai-tests-3-$SHORT_SHA"
          kubectl wait --for=condition=complete --timeout=600s job/"$HELM_RELEASE" -n default || (echo "Tests failed or timed out" && kubectl logs job/"$HELM_RELEASE" -n default && exit 1)
          kubectl logs job/"$HELM_RELEASE" -n default || true
