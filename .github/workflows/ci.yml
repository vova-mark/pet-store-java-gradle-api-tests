# .github/workflows/ci.yml
# Conversion from GitLab CI to GitHub Actions
# Platform-specific notes and limitations are included in comments.

name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize]
    branches:
      - '**'

env:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests
  DOCKER_TAG: ${{ github.sha }}
  HELM_RELEASE: api-tests-${{ github.sha }}
  K8S_NAMESPACE: default
  HELM_CHART_PATH: .kube/pet-store

jobs:

  branch_name_check:
    name: Validate branch name
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Validate branch name
        run: |
          echo "Validating branch name '${GITHUB_REF_NAME}'..."
          if [[ "${GITHUB_REF_NAME}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name: ${GITHUB_REF_NAME}. Must match regex: ^[A-Za-z0-9_-]+$"
            exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  gradle_compile:
    name: Gradle Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Gradle Build
        run: |
          echo "Compiling project with Gradle..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD=./gradlew
          else
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD --no-daemon clean build -x check

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: gradle_compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
          docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG -o image.tar
        env:
          DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  helm_e2e_run:
    name: Helm E2E Run (manual trigger required)
    runs-on: ubuntu-latest
    needs: build
    # GitHub Actions does not support "manual" jobs natively.
    # To run this job manually, use workflow_dispatch or a separate workflow.
    # The job will run only on push events (as in GitLab).
    # if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Install AWS CLI, kubectl, helm, jq
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar jq unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Verify required variables
        run: |
          REQUIRED_VARS="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION EKS_CLUSTER_NAME HELM_RELEASE HELM_CHART_PATH"
          MISSING=false
          for v in $REQUIRED_VARS; do
            if [ -z "${!v}" ]; then
              echo "Missing required variable: $v"
              MISSING=true
            fi
          done
          if [ "$MISSING" = "true" ]; then
            echo "One or more required variables are missing. Exiting."
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          HELM_CHART_PATH: ${{ env.HELM_CHART_PATH }}
      - name: AWS Identity
        run: aws sts get-caller-identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Kubernetes context
        run: |
          kubectl config current-context
          kubectl get ns || true
      - name: Helm upgrade/install
        run: |
          IMAGE_TAG="${{ github.sha }}"
          helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_PATH}" --namespace "${K8S_NAMESPACE}"
      - name: Verify rollout
        run: |
          TIMEOUT="${{ env.HELM_WAIT_TIMEOUT || '300s' }}"
          kubectl rollout status job/"${HELM_RELEASE}" -n "${K8S_NAMESPACE}" --timeout="${TIMEOUT}" || true
        env:
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          HELM_WAIT_TIMEOUT: ${{ env.HELM_WAIT_TIMEOUT }}

  push_latest:
    name: Push Docker Image as 'latest' (main branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Docker login
        run: docker login -u ${{ secrets.CI_REGISTRY_USER }} -p ${{ secrets.CI_REGISTRY_PASSWORD }} ${{ env.DOCKER_REGISTRY }}
      - name: Load, tag, and push image
        run: |
          docker load < image.tar
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest
        env:
          DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

  push_branch_sha:
    name: Push Docker Image as '{sha}' (non-main branches)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Docker login
        run: docker login -u ${{ secrets.CI_REGISTRY_USER }} -p ${{ secrets.CI_REGISTRY_PASSWORD }} ${{ env.DOCKER_REGISTRY }}
      - name: Load and push image
        run: |
          docker load < image.tar
          docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG
        env:
          DOCKER_IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

# Notes:
# - Set secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_DEFAULT_REGION, EKS_CLUSTER_NAME, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD.
# - For manual helm_e2e_run triggering, consider workflow_dispatch or a separate workflow.
# - All jobs use ubuntu-latest; adjust as needed.
