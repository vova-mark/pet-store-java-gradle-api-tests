name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: ${ env.DOCKER_REGISTRY }/${{ github.repository }}
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
          docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG > image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  push_latest:
    name: Push Docker image as 'latest' (main branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        env:
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: echo "$CI_REGISTRY_PASSWORD" | docker login $DOCKER_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
      - name: Load Docker image
        run: docker load < image.tar
      - name: Tag and push as latest
        run: |
          docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:latest

  push_branch_sha:
    name: Push Docker image as '{sha}' (non-main branches)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker registry
        env:
          CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
          CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: echo "$CI_REGISTRY_PASSWORD" | docker login $DOCKER_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
      - name: Load Docker image
        run: docker load < image.tar
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG
