name: CI Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  CI_REGISTRY_USER: ${{ secrets.CI_REGISTRY_USER }}
  CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${{ github.sha }} .
      - name: Save Docker image as artifact
        run: |
          docker save ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${{ github.sha }} -o image.tar
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

  push_latest:
    name: Push Docker Image as latest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: |
          docker load -i image.tar
      - name: Tag and push as latest
        run: |
          docker tag ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${{ github.sha }} ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:latest

  push_branch_sha:
    name: Push Docker Image with Branch SHA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name != 'main'
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.CI_REGISTRY_USER }}
          password: ${{ env.CI_REGISTRY_PASSWORD }}
      - name: Load Docker image
        run: |
          docker load -i image.tar
      - name: Tag and push with short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          docker tag ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${{ github.sha }} ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${SHORT_SHA}
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:${SHORT_SHA}
