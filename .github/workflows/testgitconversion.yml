name: CI

on:
  push:
    branches:
      - "**"

env:
  DOCKER_REGISTRY: registry.git.epam.com
  # Equivalent to GitLab's CI_PROJECT_PATH is GitHub's "owner/repo"
  DOCKER_IMAGE_NAME: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}

jobs:
  branch_name_check:
    name: Branch name policy check
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch name regex
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "Checking branch name '${BRANCH}' against regex..."
          # Exempt branches
          if [[ "${BRANCH}" == "main" || "${BRANCH}" == "quality_gates" ]]; then
            echo "Branch exempted from regex check: ${BRANCH}"
            exit 0
          fi
          # Only enforce on branch refs
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Not a branch ref, skipping."
            exit 0
          fi
          # Regex: (feature|bug|improvement)/[slug]
          if [[ "${BRANCH}" =~ ^(feature|bug|improvement)/[0-9A-Za-z-_]+$ ]]; then
            echo "Branch name OK: ${BRANCH}"
          else
            echo "Branch name violates policy: ${BRANCH}"
            exit 1
          fi

  compile:
    name: Compile (Gradle assemble)
    runs-on: ubuntu-latest
    needs: [branch_name_check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble
        run: ./gradlew clean assemble --no-daemon

  build_non_main:
    name: Build Docker image (non-main)
    runs-on: ubuntu-latest
    needs: [compile]
    if: ${{ github.ref_name != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute short SHA tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build image
        run: docker build -t "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" .
      - name: Save image as tar
        run: docker save "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" > image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  build_main:
    name: Build Docker image (main)
    runs-on: ubuntu-latest
    needs: [compile]
    if: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute short SHA tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build image
        run: docker build -t "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" .
      - name: Save image as tar
        run: docker save "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" > image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

  push_latest:
    name: Push latest (main)
    runs-on: ubuntu-latest
    needs: [build_main]
    if: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: .
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Compute short SHA tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Load image
        run: docker load -i image.tar
      - name: Tag and push latest
        run: |
          docker tag "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}" "${{ env.DOCKER_IMAGE_NAME }}:latest"
          docker push "${{ env.DOCKER_IMAGE_NAME }}:latest"

  push_branch_sha:
    name: Push SHA tag (non-main)
    runs-on: ubuntu-latest
    needs: [build_non_main]
    if: ${{ github.ref_name != 'main' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: .
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - name: Compute short SHA tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Load image
        run: docker load -i image.tar
      - name: Push SHA-tagged image
        run: docker push "${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}"

  test_cloud:
    name: Cloud tests (EKS + Helm)
    runs-on: ubuntu-latest
    needs: [compile]
    # Run on all branches regardless of other job outcomes
    if: ${{ always() }}
    env:
      AWS_REGION: eu-north-1
      HELM_RELEASE: set-ai-tests-3-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install AWS CLI
        shell: bash
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          sudo apt-get update -y && sudo apt-get install -y unzip
          unzip awscliv2.zip
          sudo ./aws/install

      # Configure AWS CLI credentials from GitHub Secrets (mirrors GitLab approach)
      - name: Configure AWS CLI
        shell: bash
        run: |
          aws --version
          aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID}"
          aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY}"
          aws configure set aws_session_token "${AWS_SESSION_TOKEN}"
          aws configure set region "${AWS_DEFAULT_REGION:-$AWS_REGION}"
          aws configure set output json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Install kubectl
        shell: bash
        run: |
          curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Install Helm
        shell: bash
        run: |
          curl -sSL https://get.helm.sh/helm-v3.13.3-linux-amd64.tar.gz -o helm.tar.gz
          tar -xzf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          sudo chmod +x /usr/local/bin/helm

      - name: Configure kubeconfig for EKS
        shell: bash
        run: aws eks update-kubeconfig --name set-ai --region "${AWS_DEFAULT_REGION:-$AWS_REGION}"
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Deploy test job via Helm
        shell: bash
        run: |
          helm upgrade --install "${HELM_RELEASE}" .kube/pet-store-tests -n default \
            --set image.repository="registry.git.epam.com/epmc-tedu/ai_playground/pet-store-java-gradle-api-tests" \
            --set image.tag="latest" \
            --set image.imagePullSecret="regcred" \
            --set namespace="default" \
            --set serviceAccountName="default" \
            --set keyVault.enabled=true \
            --set kubeSecretReferenceName="set-ai-secret" \
            --set keyVault.api-secrets.objectType="secretsmanager" \
            --set-string keyVault.api-secrets.jmesPath[0].path="bff-api-key" \
            --set-string env.ARGS="-Denv=dev"

      - name: Wait for job completion and dump logs
        shell: bash
        run: |
          set -e
          if ! kubectl wait --for=condition=complete --timeout=600s job/"${HELM_RELEASE}" -n default; then
            echo "Tests failed or timed out"
            kubectl logs job/"${HELM_RELEASE}" -n default || true
            exit 1
          fi
          kubectl logs job/"${HELM_RELEASE}" -n default || true
