stages:
  - validate
  - compile
  - build
  - cloud-test
  - push

variables:
  DOCKER_REGISTRY: registry.git.epam.com
  DOCKER_IMAGE_NAME: ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}
  DOCKER_TAG: ${CI_COMMIT_SHORT_SHA}
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  HELM_RELEASE: ${CI_PROJECT_PATH}-${CI_COMMIT_SHORT_SHA}
  K8S_NAMESPACE: default
  HELM_CHART_PATH: .kube/pet-store-tests

default:
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      command: ["--tls=false"]
  tags:
    - docker

# Validate branch name matches allowed pattern
branch_name_check:
  stage: validate
  image: alpine:3.19
  services: []
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - echo "Validating branch name '${CI_COMMIT_BRANCH}'..."
    - |
      if echo "${CI_COMMIT_BRANCH}" | grep -Eq '^[A-Za-z0-9_-]+$'; then
        echo "Branch name is valid."
      else
        echo "Invalid branch name: ${CI_COMMIT_BRANCH}. Must match regex: ^[A-Za-z0-9_-]+$"
        exit 1
      fi

# Compile with Gradle
gradle_compile:
  stage: compile
  image: gradle:8.7.0-jdk21
  services: []
  tags:
    - docker
  cache:
    key: gradle-cache
    paths:
      - .gradle/wrapper
      - .gradle/caches
  before_script:
    - gradle --version
  script:
    - echo "Compiling project with Gradle..."
    - |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        GRADLE_CMD=./gradlew
      else
        GRADLE_CMD=gradle
      fi
      $GRADLE_CMD --no-daemon clean build

# Build job for all branches
build:
  stage: build
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
    - docker save $DOCKER_IMAGE_NAME:$DOCKER_TAG > image.tar
  artifacts:
    paths:
      - image.tar

# Cloud test with Helm on EKS (manual on push pipelines)
helm_e2e_run:
  stage: cloud-test
  image: amazon/aws-cli:2.15.36
  services: []
  tags:
    - docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
    - when: never
  before_script:
    - echo "Preparing environment and verifying required variables..."
    - |
      REQUIRED_VARS="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION EKS_CLUSTER_NAME HELM_RELEASE HELM_CHART_PATH"
      MISSING=false
      for v in $REQUIRED_VARS; do
        if [ -z "${!v}" ]; then
          echo "Missing required variable: $v"
          MISSING=true
        fi
      done
      if [ "$MISSING" = "true" ]; then
        echo "One or more required variables are missing. Exiting."
        exit 1
      fi
    - export VERIFY_CHECKSUM=false
    - export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
    - export AWS_SESSION_TOKEN="${AWS_SESSION_TOKEN}"
    - export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION}"
    - echo "Installing required tools if missing (kubectl, helm, curl, tar, jq)..."
    - |
      if ! command -v curl >/dev/null 2>&1; then
        yum install -y curl >/dev/null
      fi
      if ! command -v tar >/dev/null 2>&1; then
        yum install -y tar gzip >/dev/null
      fi
      if ! command -v jq >/dev/null 2>&1; then
        yum install -y jq >/dev/null
      fi
      if ! command -v kubectl >/dev/null 2>&1; then
        KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
        curl -Lo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm -f kubectl
      fi
      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
    - echo "Verifying AWS identity..."
    - aws sts get-caller-identity
    - echo "Updating kubeconfig for EKS cluster '${EKS_CLUSTER_NAME}' in region '${AWS_DEFAULT_REGION}'..."
    - aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_DEFAULT_REGION}"
    - echo "Kubernetes context:"
    - kubectl config current-context
    - kubectl get ns || true
  script:
    - echo "Running Helm upgrade --install for release '${HELM_RELEASE}' in namespace '${K8S_NAMESPACE}' using chart '${HELM_CHART_PATH}'..."
    - |
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART_PATH}" --namespace "${K8S_NAMESPACE}"
    - echo "Verifying rollout..."
    - |
      if [ -n "${HELM_WAIT_TIMEOUT:-}" ]; then
        TIMEOUT="${HELM_WAIT_TIMEOUT}"
      else
        TIMEOUT="300s"
      fi
      kubectl rollout status job/"${HELM_RELEASE}" -n "${K8S_NAMESPACE}" --timeout="${TIMEOUT}" || true

# Push as 'latest' only on main
push_latest:
  stage: push
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - echo "Logging in to registry $DOCKER_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY
  script:
    - docker load < image.tar
    - docker tag $DOCKER_IMAGE_NAME:$DOCKER_TAG $DOCKER_IMAGE_NAME:latest
    - docker push $DOCKER_IMAGE_NAME:latest

# Push as '{sha}' on non-main branches
push_branch_sha:
  stage: push
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  before_script:
    - echo "Logging in to registry $DOCKER_REGISTRY..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY
  script:
    - docker load < image.tar
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_TAG
